# Gate de CI do CASA Standard (§3/§8) — instalado pelo casa-init em
# .github/workflows/docs-check.yml quando o repo tem remote do GitHub (ADR-0006).
# O casa-init troca `branches: [main]` pelo branch padrão do repo. Para o gate valer de
# fato, marque o check `docs-check` como obrigatório na proteção desse branch.
name: docs-check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:   # fila de merge: o check obrigatório também precisa rodar aqui

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar docs (CASA Standard §8)
        env:
          # PR: branch de destino; fila de merge: base do grupo; push: commit anterior ao push.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          if git rev-parse -q --verify "${BASE}^{commit}" >/dev/null; then
            python3 scripts/docs-check --check-adr-immutability --base-ref "$BASE"
          else
            echo "::warning::sem base comparável ('${BASE}': primeiro push ou force-push) — imutabilidade de ADR NÃO verificada neste evento"
            python3 scripts/docs-check
          fi
