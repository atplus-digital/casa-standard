name: casa-update-check

# SCHEDULED detection of outdated CASA contracts (casa-standard ADR-0016, SPEC-0008).
# Kept outside the CI gate by design: network access is acceptable here, and failures
# never block a PR or commit. Drift surfaces as ONE issue with label `casa-update` —
# updated while behind, closed automatically once caught up. Adjust the cron freely:
# once created, this workflow belongs to the repo (casa-init never overwrites it).

on:
  schedule:
    - cron: "17 9 * * 1"   # Monday 09:17 UTC — intentionally offset from top of hour
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  casa-update-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare declared contract against upstream (ADR-0016)
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/casa-update-check
