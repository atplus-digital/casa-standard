name: docs-check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:   # merge queue: required status checks must also trigger here

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","ready_for_review"]'), github.event.action) && github.event.pull_request.head.repo.id && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.id == github.event.repository.id)) && fromJSON('["self-hosted","linux","x64","platon-linux-x64-compat"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs (CASA Standard §8)
        env:
          # PR: target branch; merge queue: group base; push: previous commit before push.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          if git rev-parse -q --verify "${BASE}^{commit}" >/dev/null; then
            python3 scripts/docs-check --check-adr-immutability --base-ref "$BASE"
          else
            echo "::warning::no comparable base ('${BASE}': initial push or force-push) — ADR immutability NOT verified on this event"
            python3 scripts/docs-check
          fi
      - name: Test docs-check validator (SPEC-0003..0009, 0012)
        run: bash scripts/test-docs-check
      - name: Test casa-init bootstrap (SPEC-0001, 0009, 0010)
        run: scripts/test-casa-init
      - name: Test docs-reserve ledger (SPEC-0007, 0012)
        run: scripts/test-docs-reserve
      - name: Test casa-update-check (SPEC-0008)
        run: scripts/test-update-check
      - name: Test curl|sh installer (SPEC-0002)
        run: scripts/test-install
      - name: Test bilingual site builder & i18n parity (SPEC-0011, 0012)
        run: scripts/test-site
