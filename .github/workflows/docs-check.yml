name: docs-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","synchronize","ready_for_review"]'), github.event.action) && github.event.pull_request.head.repo.id && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.id == github.event.repository.id)) && fromJSON('["self-hosted","linux","x64","platon-linux-x64-compat"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar docs (CASA Standard §8)
        env:
          # PR: compara com o branch de destino; push: com o commit anterior ao push.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if git rev-parse -q --verify "${BASE}^{commit}" >/dev/null; then
            python3 scripts/docs-check --check-adr-immutability --base-ref "$BASE"
          else
            echo "::notice::sem base comparável ('${BASE}': primeiro push ou force-push) — imutabilidade de ADR não verificada neste evento"
            python3 scripts/docs-check
          fi
      - name: Testar validador docs-check (SPEC-0003)
        run: bash scripts/test-docs-check
      - name: Testar bootstrap casa-init (SPEC-0001)
        run: scripts/test-casa-init
      - name: Testar reserva docs-reserve (SPEC-0007)
        run: scripts/test-docs-reserve
      - name: Testar update-check (SPEC-0008)
        run: scripts/test-update-check
      - name: Testar instalador curl|sh (SPEC-0002)
        run: scripts/test-install
